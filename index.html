<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADAM HOCHMUTH</title>
  
  <!-- Import Inter (300 Light jako záložní font pro systémy bez Helvetica Neue + 700 Bold pro logo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Knihovna SheetJS pro přímé čtení souboru database.xlsx -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #111111;
      --muted-text: #737373;
      --border-color: #111111;
      --border-width: 0.5px;
      --hover-accent: rgb(149, 0, 0);
      --logo-bar-height: 62px;
      --table-header-height: 24px;
      --body-font: 'Helvetica Neue', 'HelveticaNeue-Light', 'Helvetica Neue Light', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --logo-font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--body-font);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 10px;
      line-height: 1.35;
      font-weight: 300;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* --- MAINTENANCE REŽIM --- */
    .maintenance-screen {
      display: none;
      position: fixed;
      inset: 0;
      background-color: var(--bg-color);
      z-index: 9999;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    .maintenance-screen.active {
      display: flex;
    }

    .maintenance-logo {
      font-family: var(--logo-font);
      font-weight: 700;
      font-size: 30px;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .maintenance-info {
      font-size: 10px;
      font-weight: 300;
      line-height: 1.6;
    }

    /* --- FIXNÍ LIŠTA S LOGEM (PRŮHLEDNÁ NA KOLÁŽI, BÍLÁ NA INDEXU) --- */
    .fixed-logo-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--logo-bar-height);
      padding: 0 24px;
      display: flex;
      align-items: center;
      background-color: transparent;
      pointer-events: none;
      transition: background-color 0.2s ease;
      z-index: 250;
    }

    .fixed-logo-bar.has-bg {
      background-color: rgba(255, 255, 255, 0.98);
      pointer-events: auto;
    }

    .logo {
      font-family: var(--logo-font);
      font-weight: 700;
      font-size: 30px;
      line-height: 1;
      letter-spacing: 0.02em;
      color: var(--text-color);
      cursor: pointer;
      pointer-events: auto;
      transition: color 0.15s ease;
    }

    .logo:hover {
      color: var(--hover-accent);
    }

    /* --- PLOVOUCÍ KRUHOVÁ TLAČÍTKA VPRAVO DOLE --- */
    .floating-controls {
      position: fixed;
      right: 24px;
      bottom: 24px;
      display: flex;
      gap: 10px;
      z-index: 260;
    }

    .circle-action-btn {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: var(--text-color);
      color: #ffffff;
      border: none;
      font-family: var(--body-font);
      font-size: 8.5px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .circle-action-btn:hover,
    .circle-action-btn.is-active {
      background-color: var(--hover-accent);
    }

    /* Šipka umístěná nad textem tak, aby samotné slovo INDEX / ÚVOD sedělo přesně na středu jako KONTAKT */
    .btn-arrow-top {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8.5px;
      line-height: 1;
    }

    /* =====================================================================
       ÚVODNÍ KOLÁŽ (DESKTOP / LANDSCAPE KOMPOZICE)
       ===================================================================== */
    .collage-section {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--logo-bar-height) + 10px) 24px 36px 24px;
      background-color: var(--bg-color);
    }

    .collage-canvas {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - var(--logo-bar-height) - 46px);
    }

    .collage-item {
      position: absolute;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.25s ease;
    }

    .collage-item:hover {
      opacity: 0.88;
    }

    .collage-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Technické výkresy (sloty 2, 3, 6) splynou s bílým pozadím při překryvu */
    .collage-slot-2,
    .collage-slot-3,
    .collage-slot-6 {
      mix-blend-mode: multiply;
    }

    /* Přesné souřadnice prvků 1–7 pro Desktop (Landscape 16:9) */
    .collage-slot-1 {
      left: 11.8%;
      top: 9%;
      width: 21.7%;
      z-index: 4;
    }

    .collage-slot-2 {
      left: 6.2%;
      top: 50.5%;
      width: 12.6%;
      z-index: 2;
    }

    .collage-slot-3 {
      left: 21%;
      top: 39%;
      width: 22.2%;
      z-index: 1;
    }

    .collage-slot-4 {
      left: 41.1%;
      top: 17.5%;
      width: 21.9%;
      z-index: 3;
    }

    .collage-slot-5 {
      left: 65.4%;
      top: 9.8%;
      width: 18.6%;
      z-index: 3;
    }

    .collage-slot-6 {
      left: 66.8%;
      top: 38.5%;
      width: 22.8%;
      z-index: 5;
    }

    .collage-slot-7 {
      left: 37.8%;
      top: 58.2%;
      width: 38.6%;
      z-index: 4;
    }

    /* =====================================================================
       INDEXOVÝ SEZNAM PROJEKTŮ S PŘICHYCENÝM ZÁHLAVÍM A AKORDEONEM
       ===================================================================== */
    .index-section {
      position: relative;
      background-color: var(--bg-color);
      padding-bottom: 140px;
    }

    /* Společná mřížka sloupců: Č. | Projekt | Typologie | Lokalita | Rok | Typ */
    .grid-cols {
      display: grid;
      grid-template-columns: 52px 2fr 1.15fr 1.25fr 95px 0.9fr;
    }

    /* Záhlaví tabulky, které se při odrolování zamkne přesně pod logem */
    .table-header {
      position: sticky;
      top: var(--logo-bar-height);
      height: var(--table-header-height);
      padding: 0 24px;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.98);
      border-bottom: var(--border-width) solid var(--border-color);
      color: var(--text-color);
      font-size: 8px;
      font-weight: 400;
      z-index: 200;
    }

    .project-block {
      border-bottom: var(--border-width) solid var(--border-color);
      scroll-margin-top: calc(var(--logo-bar-height) + var(--table-header-height));
    }

    /* Řádek projektu v seznamu */
    .project-row {
      padding: 7px 24px;
      align-items: baseline;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .project-row:hover,
    .project-row:hover .col-num,
    .project-row:hover .col-type {
      color: var(--hover-accent);
    }

    /* Otevřený projekt: karmínově červený a tučný název */
    .project-block.is-open .project-row,
    .project-block.is-open .col-num,
    .project-block.is-open .col-type {
      color: var(--hover-accent);
    }

    .project-block.is-open .col-title {
      font-weight: 700;
    }

    .col-num {
      color: var(--muted-text);
      font-variant-numeric: tabular-nums;
      transition: color 0.15s ease;
    }

    .col-title {
      font-weight: 400;
      padding-right: 16px;
    }

    .col-typology, .col-loc, .col-year, .col-type {
      color: inherit;
      transition: color 0.15s ease;
    }

    .col-year {
      padding-right: 32px;
    }

    /* --- ROZBALOVACÍ AKORDEON ZAROVNANÝ S PRVNÍM SLOUPCEM (24px) --- */
    .project-accordion {
      display: none;
      padding: 12px 24px 22px 24px;
    }

    .project-block.is-open .project-accordion {
      display: block;
    }

    .accordion-info {
      display: grid;
      grid-template-columns: minmax(220px, 460px) 1fr;
      gap: 32px;
      margin-bottom: 16px;
    }

    .accordion-description {
      font-size: 10px;
      font-weight: 300;
      line-height: 1.55;
      color: var(--text-color);
      white-space: pre-line;
    }

    .accordion-extra-meta {
      display: grid;
      grid-template-columns: 80px 1fr;
      row-gap: 3px;
      align-content: start;
      font-size: 10px;
      font-weight: 300;
    }

    .meta-label {
      color: var(--muted-text);
    }

    /* Vodorovný pás fotek uvnitř rozbaleného akordeonu */
    .accordion-gallery {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .accordion-gallery img {
      height: 230px;
      width: auto;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
      background-color: #f4f4f4;
      transition: opacity 0.15s ease;
    }

    .accordion-gallery img:hover {
      opacity: 0.9;
    }

    /* --- VÝSUVNÝ PANEL KONTAKT (KONČÍ CCA 2 CM NAD TLAČÍTKY) --- */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 230;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .contact-drawer {
      position: fixed;
      top: var(--logo-bar-height);
      right: 0;
      width: 10cm;
      max-width: 90vw;
      /* 24px (spodní okraj) + 56px (výška tlačítka) + 2cm (odsazení nad tlačítkem) */
      height: calc(100vh - var(--logo-bar-height) - 80px - 2cm);
      max-height: 620px;
      background-color: var(--bg-color);
      border-top: var(--border-width) solid var(--border-color);
      border-left: var(--border-width) solid var(--border-color);
      border-bottom: var(--border-width) solid var(--border-color);
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 240;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding-bottom: 24px;
    }

    .contact-drawer.open {
      transform: translateX(0);
    }

    .drawer-top {
      display: flex;
      align-items: center;
      min-height: 58px;
      padding: 14px 24px;
      border-bottom: var(--border-width) solid var(--border-color);
    }

    .drawer-title {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.25;
    }

    .drawer-body {
      padding: 20px 24px 0 24px;
    }

    .drawer-meta {
      display: grid;
      grid-template-columns: 88px 1fr;
      row-gap: 4px;
      margin-bottom: 20px;
      font-size: 10px;
      font-weight: 300;
    }

    .drawer-description {
      font-size: 10px;
      font-weight: 300;
      line-height: 1.5;
      color: var(--text-color);
      margin-bottom: 24px;
      white-space: pre-line;
    }

    /* --- ZVĚTŠENÍ FOTKY (LIGHTBOX) --- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.97);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
    }

    .status-message {
      padding: 24px;
      color: var(--muted-text);
      font-size: 10px;
      font-weight: 300;
      line-height: 1.6;
    }

    /* =====================================================================
       RESPONZIVITA PRO TABLET A TELEFON (PORTRAIT KOMPOZICE KOLÁŽE)
       ===================================================================== */
    @media (max-width: 820px) {
      :root {
        --logo-bar-height: 52px;
      }

      .logo, .maintenance-logo {
        font-size: 20px;
      }

      .floating-controls {
        right: 16px;
        bottom: 16px;
        gap: 8px;
      }

      .circle-action-btn {
        width: 50px;
        height: 50px;
        font-size: 8px;
      }

      .btn-arrow-top {
        top: 9px;
        font-size: 8px;
      }

      /* Menší spodní odsazení karty Kontakt nad tlačítky na mobilu (cca 1.2cm) */
      .contact-drawer {
        height: calc(100vh - var(--logo-bar-height) - 66px - 1.2cm);
      }

      /* Přepnutí koláže na novou vertikální (Portrait) kompozici */
      .collage-section {
        padding: calc(var(--logo-bar-height) + 8px) 16px 24px 16px;
        align-items: flex-start;
      }

      .collage-canvas {
        aspect-ratio: 9 / 17.5;
        max-height: none;
        max-width: 520px;
        margin: 0 auto;
      }

      .collage-slot-1 {
        left: 38.5%;
        top: 1%;
        width: 45.8%;
        z-index: 4;
      }

      .collage-slot-2 {
        left: 62%;
        top: 23.5%;
        width: 27%;
        z-index: 2;
      }

      .collage-slot-3 {
        left: 4.5%;
        top: 10.5%;
        width: 48%;
        z-index: 1;
      }

      .collage-slot-4 {
        left: 6.5%;
        top: 50.8%;
        width: 45.8%;
        z-index: 4;
      }

      .collage-slot-5 {
        left: 48.2%;
        top: 39.2%;
        width: 39.2%;
        z-index: 3;
      }

      .collage-slot-6 {
        left: 41.5%;
        top: 59.5%;
        width: 47.5%;
        z-index: 3;
      }

      .collage-slot-7 {
        left: 9.2%;
        top: 76.2%;
        width: 80.2%;
        z-index: 5;
      }

      /* Úprava sloupců seznamu na mobilu */
      .grid-cols {
        grid-template-columns: 38px 1.8fr 1fr 46px;
      }

      .col-typology,
      .col-type {
        display: none;
      }

      .accordion-info {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .accordion-gallery img {
        height: 175px;
      }
    }
  </style>
</head>
<body>

  <!-- OBRAZOVKA PRO MAINTENANCE MÓD -->
  <div class="maintenance-screen" id="maintenance-screen">
    <div class="maintenance-logo">ADAM HOCHMUTH</div>
    <div class="maintenance-info">
      STRÁNKY JSOU V PŘÍPRAVĚ.<br>
      KONTAKT: INFO@ADAMHOCHMUTH.CZ
    </div>
  </div>

  <!-- FIXNÍ LIŠTA S LOGEM (PRŮHLEDNÁ NA KOLÁŽI, BÍLÁ NA INDEXU) -->
  <div class="fixed-logo-bar" id="fixed-logo-bar">
    <div class="logo" onclick="scrollToTop()">ADAM HOCHMUTH</div>
  </div>

  <!-- PLOVOUCÍ KRUHOVÁ TLAČÍTKA VPRAVO DOLE -->
  <div class="floating-controls">
    <button class="circle-action-btn" id="scroll-toggle-btn" onclick="handleScrollToggle()">
      <span class="btn-arrow-top">&darr;</span><span>INDEX</span>
    </button>
    <button class="circle-action-btn" id="contact-btn" onclick="toggleContactDrawer()">
      <span>KONTAKT</span>
    </button>
  </div>

  <!-- 1. ÚVODNÍ KOLÁŽ PROJEKTŮ -->
  <section class="collage-section" id="collage-section">
    <div class="collage-canvas" id="collage-canvas"></div>
  </section>

  <!-- 2. INDEXOVÝ SEZNAM PROJEKTŮ -->
  <main class="index-section" id="index-section">
    <div class="table-header grid-cols">
      <div>Č.</div>
      <div>Projekt</div>
      <div class="col-typology">Typologie</div>
      <div>Lokalita</div>
      <div class="col-year">Rok</div>
      <div class="col-type">Typ</div>
    </div>

    <div id="projects-container"></div>
  </main>

  <!-- POZADÍ PRO ZAVŘENÍ KONTAKTU KLIKNUTÍM MIMO -->
  <div class="drawer-backdrop" id="backdrop" onclick="closeContactDrawer()"></div>

  <!-- VÝSUVNÝ PANEL KONTAKT -->
  <aside class="contact-drawer" id="contact-drawer">
    <div class="drawer-top">
      <h2 class="drawer-title">ADAM HOCHMUTH</h2>
    </div>

    <div class="drawer-body">
      <div class="drawer-description">
        Text o ateliéru doplníte zde.
      </div>

      <div class="drawer-meta">
        <div class="meta-label">Adresa</div>
        <div>—</div>

        <div class="meta-label">E-mail</div>
        <div>—</div>

        <div class="meta-label">Telefon</div>
        <div>—</div>

        <div class="meta-label">IČO</div>
        <div>—</div>
      </div>
    </div>
  </aside>

  <!-- LIGHTBOX PRO ZVĚTŠENÍ FOTKY -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Detail projektu">
  </div>

  <script>
    /* =====================================================================
       HLAVNÍ NASTAVENÍ (ZDE MŮŽETE ZAPNOUT ÚDRŽBOVÝ REŽIM)
       false = web normálně běží | true = zobrazí se jen úvodní info obrazovka
       ===================================================================== */
    const MAINTENANCE_MODE = false;

    const EXCEL_FILE = 'database.xlsx';
    const IMAGES_FOLDER = 'images/';

    if (MAINTENANCE_MODE) {
      document.getElementById('maintenance-screen').classList.add('active');
    }

    let activeProjects = [];
    const container = document.getElementById('projects-container');
    const collageCanvas = document.getElementById('collage-canvas');

    function getCol(row, possibleNames) {
      for (const name of possibleNames) {
        for (const key of Object.keys(row)) {
          if (key.trim().toLowerCase() === name.toLowerCase()) {
            const val = row[key];
            return val !== undefined && val !== null ? String(val).trim() : '';
          }
        }
      }
      return '';
    }

    function formatImgPath(file) {
      if (!file) return '';
      return file.startsWith('http') ? file : `${IMAGES_FOLDER}${file}`;
    }

    async function loadDatabase() {
      if (MAINTENANCE_MODE) return;

      try {
        const response = await fetch(`${EXCEL_FILE}?v=${Date.now()}`);
        if (!response.ok) {
          throw new Error(`Soubor ${EXCEL_FILE} nebyl nalezen (HTTP ${response.status}).`);
        }

        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];

        const rawRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

        activeProjects = rawRows
          .filter(row => {
            const isOnline = getCol(row, ['online']).toLowerCase();
            const title = getCol(row, ['projekt', 'nazev', 'název']);
            return isOnline === 'ano' && title !== '';
          })
          .map(row => {
            const rawImages = getCol(row, ['obrazky', 'obrázky']);
            const imageList = rawImages
              ? rawImages.split(',')
                  .map(s => s.trim())
                  .filter(s => s !== '')
                  .map(formatImgPath)
              : [];

            const rawCollageImg = getCol(row, ['kolaz_obrazek', 'koláž_obrázek', 'kolaz_obr']);
            const collageImage = rawCollageImg
              ? formatImgPath(rawCollageImg)
              : (imageList[0] || '');

            return {
              number: getCol(row, ['č.', 'c.', 'cislo', 'číslo']),
              title: getCol(row, ['projekt', 'nazev', 'název']),
              typology: getCol(row, ['typologie']),
              location: getCol(row, ['lokalita']),
              year: getCol(row, ['rok']),
              type: getCol(row, ['typ']),
              images: imageList,
              description: getCol(row, ['popis']),
              collageSlot: getCol(row, ['kolaz', 'koláž']),
              collageImage: collageImage
            };
          });

        renderCollage();
        renderProjects();
        handleScrollState();

      } catch (error) {
        console.error('Chyba při načítání databáze:', error);
        container.innerHTML = `
          <div class="status-message">
            NEPODAŘILO SE NAČÍST DATABÁZI (${EXCEL_FILE}).
          </div>
        `;
      }
    }

    /* --- VYKRESLENÍ ÚVODNÍ KOLÁŽE (SLOTY 1–7) --- */
    function renderCollage() {
      collageCanvas.innerHTML = '';

      activeProjects.forEach((project, index) => {
        const slot = parseInt(project.collageSlot, 10);
        if (slot >= 1 && slot <= 7 && project.collageImage) {
          const item = document.createElement('div');
          item.className = `collage-item collage-slot-${slot}`;
          item.title = `${project.number ? project.number + ' ' : ''}${project.title}`;

          const img = document.createElement('img');
          img.src = project.collageImage;
          img.alt = project.title;

          item.onclick = () => jumpToProject(index);
          item.appendChild(img);
          collageCanvas.appendChild(item);
        }
      });
    }

    /* --- VYKRESLENÍ ČISTÉHO INDEXOVÉHO SEZNAMU S AKORDEONEM --- */
    function renderProjects() {
      container.innerHTML = '';

      activeProjects.forEach((project, index) => {
        const block = document.createElement('div');
        block.className = 'project-block';
        block.id = `project-block-${index}`;

        // 1. Základní řádek projektu
        const row = document.createElement('div');
        row.className = 'project-row grid-cols';
        row.onclick = () => toggleAccordion(index);

        row.innerHTML = `
          <div class="col-num">${project.number}</div>
          <div class="col-title">${project.title}</div>
          <div class="col-typology">${project.typology}</div>
          <div class="col-loc">${project.location}</div>
          <div class="col-year">${project.year}</div>
          <div class="col-type">${project.type}</div>
        `;
        block.appendChild(row);

        // 2. Rozbalovací obsah pod řádkem (akordeon)
        const accordion = document.createElement('div');
        accordion.className = 'project-accordion';

        const metaRows = [
          { label: 'Typologie', value: project.typology },
          { label: 'Lokalita', value: project.location },
          { label: 'Rok', value: project.year },
          { label: 'Typ', value: project.type }
        ]
          .filter(m => m.value)
          .map(m => `<div class="meta-label">${m.label}</div><div>${m.value}</div>`)
          .join('');

        const infoDiv = document.createElement('div');
        infoDiv.className = 'accordion-info';
        infoDiv.innerHTML = `
          <div class="accordion-description">${project.description || ''}</div>
          <div class="accordion-extra-meta">${metaRows}</div>
        `;
        accordion.appendChild(infoDiv);

        if (project.images.length > 0) {
          const gallery = document.createElement('div');
          gallery.className = 'accordion-gallery';

          project.images.forEach(imgUrl => {
            const img = document.createElement('img');
            img.src = imgUrl;
            img.alt = project.title;
            img.loading = 'lazy';
            img.onclick = (e) => {
              e.stopPropagation();
              openLightbox(imgUrl);
            };
            gallery.appendChild(img);
          });

          accordion.appendChild(gallery);
        }

        block.appendChild(accordion);
        container.appendChild(block);
      });
    }

    /* --- OTEVŘENÍ / ZAVŘENÍ AKORDEONU --- */
    function toggleAccordion(index, forceOpen = false) {
      const targetBlock = document.getElementById(`project-block-${index}`);
      if (!targetBlock) return;

      const isAlreadyOpen = targetBlock.classList.contains('is-open');

      document.querySelectorAll('.project-block.is-open').forEach(b => {
        if (b !== targetBlock) b.classList.remove('is-open');
      });

      if (forceOpen || !isAlreadyOpen) {
        targetBlock.classList.add('is-open');
      } else {
        targetBlock.classList.remove('is-open');
      }
    }

    /* --- PŘECHOD Z OBRÁZKU V KOLÁŽI NA KONKRÉTNÍ PROJEKT V SEZNAMU --- */
    function jumpToProject(index) {
      closeContactDrawer();
      toggleAccordion(index, true);
      const targetBlock = document.getElementById(`project-block-${index}`);
      if (targetBlock) {
        targetBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    /* --- PLOVOUCÍ TLAČÍTKO INDEX / ÚVOD + BÍLÉ POZADÍ POD LOGEM --- */
    const scrollToggleBtn = document.getElementById('scroll-toggle-btn');
    const indexSection = document.getElementById('index-section');
    const fixedLogoBar = document.getElementById('fixed-logo-bar');

    function handleScrollState() {
      const indexTop = indexSection.getBoundingClientRect().top;
      const logoHeight = fixedLogoBar.offsetHeight;

      // Jakmile se index přiblíží pod lištu s logem, zapne se bílé pozadí pod logem
      if (indexTop <= logoHeight + 10) {
        fixedLogoBar.classList.add('has-bg');
      } else {
        fixedLogoBar.classList.remove('has-bg');
      }

      // Přepnutí tlačítka INDEX / ÚVOD
      if (indexTop <= window.innerHeight * 0.45) {
        scrollToggleBtn.innerHTML = '<span class="btn-arrow-top">&uarr;</span><span>ÚVOD</span>';
      } else {
        scrollToggleBtn.innerHTML = '<span class="btn-arrow-top">&darr;</span><span>INDEX</span>';
      }
    }

    window.addEventListener('scroll', handleScrollState, { passive: true });
    window.addEventListener('resize', handleScrollState, { passive: true });

    function handleScrollToggle() {
      closeContactDrawer();
      const indexTop = indexSection.getBoundingClientRect().top;
      if (indexTop <= window.innerHeight * 0.45) {
        scrollToTop();
      } else {
        indexSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function scrollToTop() {
      closeContactDrawer();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* --- PANEL KONTAKT --- */
    const contactDrawer = document.getElementById('contact-drawer');
    const contactBtn = document.getElementById('contact-btn');
    const backdrop = document.getElementById('backdrop');

    function toggleContactDrawer() {
      const isOpen = contactDrawer.classList.contains('open');
      if (isOpen) {
        closeContactDrawer();
      } else {
        contactDrawer.scrollTop = 0;
        contactDrawer.classList.add('open');
        contactBtn.classList.add('is-active');
        backdrop.classList.add('open');
      }
    }

    function closeContactDrawer() {
      contactDrawer.classList.remove('open');
      contactBtn.classList.remove('is-active');
      backdrop.classList.remove('open');
    }

    /* --- LIGHTBOX --- */
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('lightbox').classList.contains('open')) {
          closeLightbox();
        } else {
          closeContactDrawer();
        }
      }
    });

    loadDatabase();
  </script>
</body>
</html>
