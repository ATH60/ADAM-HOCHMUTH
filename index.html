<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADAM HOCHMUTH</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@700&display=swap" rel="stylesheet">

  <!-- Knihovna SheetJS pro přímé čtení souboru database.xlsx -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #111111;
      --muted-text: #737373;
      --border-color: #111111;
      --hover-accent: rgb(149, 0, 0);
      --drawer-width: 40vw;
      --header-height: 58px;
      --table-header-height: 24px;
      --mono-font: 'Simplon Mono', 'SimplonMono', 'IBM Plex Mono', monospace;
      --logo-font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--mono-font);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 11px;
      line-height: 1.35;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* --- MAINTENANCE REŽIM --- */
    .maintenance-screen {
      display: none;
      position: fixed;
      inset: 0;
      background-color: var(--bg-color);
      z-index: 9999;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    .maintenance-screen.active {
      display: flex;
    }

    .maintenance-logo {
      font-family: var(--logo-font);
      font-weight: 700;
      font-size: 30px;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .maintenance-info {
      font-size: 11px;
      line-height: 1.6;
    }

    /* --- PEVNÁ HORNÍ LIŠTA (HLAVIČKA + ZÁHLAVÍ TABULKY) --- */
    .fixed-top-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.98);
      z-index: 100;
    }

    header {
      height: var(--header-height);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
    }

    .logo {
      font-family: var(--logo-font);
      font-weight: 700;
      font-size: 30px;
      line-height: 1;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .logo:hover {
      color: var(--hover-accent);
    }

    .nav-btn {
      background: none;
      border: none;
      font-family: var(--mono-font);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text-color);
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.15s ease;
    }

    .nav-btn:hover {
      color: var(--hover-accent);
    }

    /* Společná mřížka sloupců: Č. | Projekt | Typologie | Lokalita | Rok | Typ */
    .grid-cols {
      display: grid;
      grid-template-columns: 52px 2fr 1.15fr 1.25fr 95px 0.9fr;
    }

    .table-header {
      height: var(--table-header-height);
      padding: 0 24px;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 10px;
      font-weight: 500;
    }

    /* --- HLAVNÍ SEZNAM (INDEX VIEW) --- */
    main {
      margin-top: calc(var(--header-height) + var(--table-header-height));
      padding-bottom: 100px;
    }

    .project-block {
      border-bottom: 1px solid var(--border-color);
    }

    /* --- VODOROVNÝ PÁS OBRÁZKŮ (CAROUSEL) --- */
    .project-carousel {
      display: flex;
      gap: 8px;
      padding: 12px 24px 6px 24px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .project-carousel::-webkit-scrollbar {
      display: none;
    }

    .project-carousel img {
      height: 178px;
      width: auto;
      object-fit: cover;
      display: block;
      cursor: pointer;
      background-color: #f4f4f4;
    }

    /* --- ŘÁDEK S INFORMACEMI O PROJEKTU --- */
    .project-row {
      padding: 6px 24px;
      align-items: baseline;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .project-row:hover,
    .project-row:hover .col-num,
    .project-row:hover .col-type {
      color: var(--hover-accent);
    }

    .project-row.is-active .col-title {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .col-num {
      color: var(--muted-text);
      font-variant-numeric: tabular-nums;
      transition: color 0.15s ease;
    }

    .col-title {
      font-weight: 500;
      padding-right: 16px;
    }

    .col-typology, .col-loc, .col-year, .col-type {
      color: inherit;
      transition: color 0.15s ease;
    }

    .col-year {
      padding-right: 32px;
    }

    /* --- VÝSUVNÉ BOČNÍ PANELY --- */
    .drawer-backdrop {
      position: fixed;
      top: var(--header-height);
      left: 0;
      width: 100%;
      height: calc(100vh - var(--header-height));
      background: rgba(255, 255, 255, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 150;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .side-drawer {
      position: fixed;
      top: var(--header-height);
      right: 0;
      width: var(--drawer-width);
      height: calc(100vh - var(--header-height));
      background-color: var(--bg-color);
      border-left: 1px solid var(--border-color);
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 24px 60px 24px;
    }

    #contact-drawer {
      width: 10cm;
      max-width: 90vw;
    }

    .side-drawer.open {
      transform: translateX(0);
    }

    .drawer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .drawer-subtitle {
      font-size: 10px;
      color: var(--muted-text);
      margin-bottom: 2px;
    }

    .drawer-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }

    .close-btn {
      background: none;
      border: none;
      font-family: var(--mono-font);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      color: var(--text-color);
      padding: 0 4px;
      transition: color 0.15s ease;
    }

    .close-btn:hover {
      color: var(--hover-accent);
    }

    .drawer-meta {
      display: grid;
      grid-template-columns: 88px 1fr;
      row-gap: 4px;
      margin-bottom: 20px;
      font-size: 11px;
    }

    .meta-label {
      color: var(--muted-text);
    }

    .drawer-description {
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-color);
      margin-bottom: 24px;
      white-space: pre-line;
    }

    .drawer-gallery {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .drawer-gallery img {
      width: 100%;
      height: auto;
      display: block;
      cursor: zoom-in;
    }

    /* --- ZVĚTŠENÍ FOTKY (LIGHTBOX) --- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.97);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
    }

    .status-message {
      padding: 24px;
      color: var(--muted-text);
      font-size: 11px;
      line-height: 1.6;
    }

    /* --- RESPONZIVITA PRO MOBIL / TABLET --- */
    @media (max-width: 900px) {
      :root {
        --drawer-width: 85vw;
      }
      .logo, .maintenance-logo {
        font-size: 20px;
      }
      .grid-cols {
        grid-template-columns: 40px 1.8fr 1fr 50px;
      }
      .col-typology,
      .col-type {
        display: none;
      }
      .project-carousel img {
        height: 145px;
      }
    }
  </style>
</head>
<body>

  <!-- OBRAZOVKA PRO MAINTENANCE MÓD -->
  <div class="maintenance-screen" id="maintenance-screen">
    <div class="maintenance-logo">ADAM HOCHMUTH</div>
    <div class="maintenance-info">
      STRÁNKY JSOU V PŘÍPRAVĚ.<br>
      KONTAKT: INFO@ADAMHOCHMUTH.CZ
    </div>
  </div>

  <!-- HORNÍ PEVNÝ PANEL VČETNĚ ZÁHLAVÍ TABULKY -->
  <div class="fixed-top-wrapper">
    <header>
      <div class="logo" onclick="closeAllDrawers()">ADAM HOCHMUTH</div>
      <button class="nav-btn" onclick="openContactDrawer()">KONTAKT</button>
    </header>

    <div class="table-header grid-cols">
      <div>Č.</div>
      <div>Projekt</div>
      <div class="col-typology">Typologie</div>
      <div>Lokalita</div>
      <div class="col-year">Rok</div>
      <div class="col-type">Typ</div>
    </div>
  </div>

  <!-- HLAVNÍ SEZNAM PROJEKTŮ -->
  <main>
    <div id="projects-container"></div>
  </main>

  <!-- POZADÍ PRO ZAVŘENÍ PANELU KLIKNUTÍM MIMO -->
  <div class="drawer-backdrop" id="backdrop" onclick="closeAllDrawers()"></div>

  <!-- VÝSUVNÝ PANEL DETAILU PROJEKTU -->
  <aside class="side-drawer" id="project-drawer">
    <div class="drawer-top">
      <div>
        <div class="drawer-subtitle" id="d-number"></div>
        <h2 class="drawer-title" id="d-title"></h2>
      </div>
      <button class="close-btn" onclick="closeAllDrawers()" aria-label="Zavřít">&times;</button>
    </div>

    <div class="drawer-meta" id="d-meta"></div>
    <div class="drawer-description" id="d-description"></div>
    <div class="drawer-gallery" id="d-gallery"></div>
  </aside>

  <!-- VÝSUVNÝ PANEL KONTAKT (ŠÍŘKA 10 CM) -->
  <aside class="side-drawer" id="contact-drawer">
    <div class="drawer-top">
      <div>
        <div class="drawer-subtitle">Informace</div>
        <h2 class="drawer-title">ADAM HOCHMUTH</h2>
      </div>
      <button class="close-btn" onclick="closeAllDrawers()" aria-label="Zavřít">&times;</button>
    </div>

    <div class="drawer-description">
      Text o ateliéru doplníte zde.
    </div>

    <div class="drawer-meta">
      <div class="meta-label">Adresa</div>
      <div>—</div>

      <div class="meta-label">E-mail</div>
      <div>—</div>

      <div class="meta-label">Telefon</div>
      <div>—</div>

      <div class="meta-label">IČO</div>
      <div>—</div>
    </div>
  </aside>

  <!-- LIGHTBOX PRO ZVĚTŠENÍ FOTKY -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Detail projektu">
  </div>

  <script>
    /* =====================================================================
       HLAVNÍ NASTAVENÍ (ZDE MŮŽETE ZAPNOUT ÚDRŽBOVÝ REŽIM)
       false = web normálně běží | true = zobrazí se jen úvodní info obrazovka
       ===================================================================== */
    const MAINTENANCE_MODE = false;

    const EXCEL_FILE = 'database.xlsx';
    const IMAGES_FOLDER = 'images/';

    if (MAINTENANCE_MODE) {
      document.getElementById('maintenance-screen').classList.add('active');
    }

    let activeProjects = [];
    const container = document.getElementById('projects-container');

    function getCol(row, possibleNames) {
      for (const name of possibleNames) {
        for (const key of Object.keys(row)) {
          if (key.trim().toLowerCase() === name.toLowerCase()) {
            const val = row[key];
            return val !== undefined && val !== null ? String(val).trim() : '';
          }
        }
      }
      return '';
    }

    async function loadDatabase() {
      if (MAINTENANCE_MODE) return;

      try {
        // Přidání časového razítka zabrání prohlížeči držet starou verzi Excelu v mezipaměti
        const response = await fetch(`${EXCEL_FILE}?v=${Date.now()}`);
        if (!response.ok) {
          throw new Error(`Soubor ${EXCEL_FILE} nebyl nalezen (HTTP ${response.status}).`);
        }

        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];

        const rawRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

        activeProjects = rawRows
          .filter(row => {
            const isOnline = getCol(row, ['online']).toLowerCase();
            const title = getCol(row, ['projekt', 'nazev', 'název']);
            return isOnline === 'ano' && title !== '';
          })
          .map(row => {
            const rawImages = getCol(row, ['obrazky', 'obrázky']);
            const imageList = rawImages
              ? rawImages.split(',')
                  .map(s => s.trim())
                  .filter(s => s !== '')
                  .map(file => file.startsWith('http') ? file : `${IMAGES_FOLDER}${file}`)
              : [];

            return {
              number: getCol(row, ['č.', 'c.', 'cislo', 'číslo']),
              title: getCol(row, ['projekt', 'nazev', 'název']),
              typology: getCol(row, ['typologie']),
              location: getCol(row, ['lokalita']),
              year: getCol(row, ['rok']),
              type: getCol(row, ['typ']),
              showCarousel: getCol(row, ['pas', 'pás']).toLowerCase() === 'ano',
              images: imageList,
              description: getCol(row, ['popis'])
            };
          });

        renderProjects();

      } catch (error) {
        console.error('Chyba při načítání databáze:', error);
        container.innerHTML = `
          <div class="status-message">
            NEPODAŘILO SE NAČÍST DATABÁZI (${EXCEL_FILE}).
          </div>
        `;
      }
    }

    function renderProjects() {
      container.innerHTML = '';

      activeProjects.forEach((project, index) => {
        const block = document.createElement('div');
        block.className = 'project-block';

        if (project.showCarousel && project.images.length > 0) {
          const carousel = document.createElement('div');
          carousel.className = 'project-carousel';

          project.images.forEach(imgUrl => {
            const img = document.createElement('img');
            img.src = imgUrl;
            img.alt = project.title;
            img.loading = "lazy";
            img.onclick = (e) => {
              e.stopPropagation();
              openProjectDrawer(index);
            };
            carousel.appendChild(img);
          });

          block.appendChild(carousel);
        }

        const row = document.createElement('div');
        row.className = 'project-row grid-cols';
        row.id = `row-${index}`;
        row.onclick = () => openProjectDrawer(index);

        row.innerHTML = `
          <div class="col-num">${project.number}</div>
          <div class="col-title">${project.title}</div>
          <div class="col-typology">${project.typology}</div>
          <div class="col-loc">${project.location}</div>
          <div class="col-year">${project.year}</div>
          <div class="col-type">${project.type}</div>
        `;

        block.appendChild(row);
        container.appendChild(block);
      });
    }

    const projectDrawer = document.getElementById('project-drawer');
    const contactDrawer = document.getElementById('contact-drawer');
    const backdrop = document.getElementById('backdrop');

    function openProjectDrawer(index) {
      const project = activeProjects[index];
      closeAllDrawers(false);

      document.getElementById(`row-${index}`).classList.add('is-active');

      document.getElementById('d-number').textContent = project.number ? `PROJEKT Č. ${project.number}` : 'PROJEKT';
      document.getElementById('d-title').textContent = project.title;
      document.getElementById('d-description').textContent = project.description;

      const metaFields = [
        { label: 'Typologie', value: project.typology },
        { label: 'Lokalita', value: project.location },
        { label: 'Rok', value: project.year },
        { label: 'Typ', value: project.type }
      ];

      const metaContainer = document.getElementById('d-meta');
      metaContainer.innerHTML = '';
      metaFields.forEach(item => {
        if (item.value) {
          metaContainer.innerHTML += `
            <div class="meta-label">${item.label}</div>
            <div>${item.value}</div>
          `;
        }
      });

      const galleryContainer = document.getElementById('d-gallery');
      galleryContainer.innerHTML = '';
      project.images.forEach(imgUrl => {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.alt = project.title;
        img.onclick = () => openLightbox(imgUrl);
        galleryContainer.appendChild(img);
      });

      projectDrawer.scrollTop = 0;
      projectDrawer.classList.add('open');
      backdrop.classList.add('open');
    }

    function openContactDrawer() {
      closeAllDrawers(false);
      contactDrawer.scrollTop = 0;
      contactDrawer.classList.add('open');
      backdrop.classList.add('open');
    }

    function closeAllDrawers(hideBackdrop = true) {
      projectDrawer.classList.remove('open');
      contactDrawer.classList.remove('open');
      document.querySelectorAll('.project-row').forEach(r => r.classList.remove('is-active'));
      if (hideBackdrop) {
        backdrop.classList.remove('open');
      }
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('lightbox').classList.contains('open')) {
          closeLightbox();
        } else {
          closeAllDrawers();
        }
      }
    });

    loadDatabase();
  </script>
</body>
</html>
